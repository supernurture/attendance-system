openapi: 3.0.3
info:
  title: Health API
  description: Liveness and readiness probes for the server.
  version: 1.0.0
tags:
  - name: health
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - health
      summary: Get health
      description: Reports whether the server is up and able to serve requests.
      responses:
        '200':
          description: The server is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetHealthResponse'
  /ready:
    get:
      operationId: getReady
      tags:
        - health
      summary: Get readiness
      description: >-
        Pings the database, Redis and the object store. Point a readiness probe here and a liveness probe
        at /health, so a dependency outage takes the instance out of rotation instead of restarting it.
      responses:
        '200':
          description: Every dependency answered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReadyResponse'
        '503':
          description: >-
            At least one dependency did not answer. Which one is logged, not returned, so the
            response does not map the infrastructure for an outside caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReadyResponse'
components:
  schemas:
    GetHealthResponse:
      type: object
      required:
        - condition
      properties:
        condition:
          type: string
          description: Health condition of the server.
          example: Healthy
    GetReadyResponse:
      type: object
      required:
        - condition
      properties:
        condition:
          type: string
          description: Readiness condition of the server.
          example: Ready
