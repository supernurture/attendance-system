openapi: 3.0.3
info:
  title: Upload API
  description: Presigned direct uploads to object storage. The file never passes through this server.
  version: 1.0.0
tags:
  - name: upload
security:
  - bearerAuth: []
paths:
  /uploads/intent:
    post:
      operationId: createUploadIntent
      tags:
        - upload
      summary: Create an upload intent
      description: |
        Returns a presigned PUT URL. PUT exactly size_bytes to url with every header in headers,
        then pass the returned key to the endpoint that uses the file. The URL writes once: a
        second PUT is refused with 412.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadIntentRequest'
      responses:
        '201':
          description: Upload URL issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadIntent'
        '400':
          description: Unsupported purpose or content type, or size out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UploadIntentRequest:
      type: object
      required:
        - purpose
        - content_type
        - size_bytes
      properties:
        purpose:
          type: string
          enum:
            - attendance_photo
            - leave_attachment
        content_type:
          type: string
          example: image/jpeg
        size_bytes:
          type: integer
          format: int64
          example: 204800
    UploadIntent:
      type: object
      required:
        - key
        - url
        - headers
        - expires_at
      properties:
        key:
          type: string
        url:
          type: string
        headers:
          type: object
          description: Headers the PUT must carry, exactly as given; they are part of the signature.
          additionalProperties:
            type: string
          example:
            Content-Type: image/jpeg
            If-None-Match: '*'
        expires_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
