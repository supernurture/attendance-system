app:
  name: attendance-system
  version: 1.0.0
  env: development # development, staging, or production

server:
  mode: debug # test, debug, or release
  port: 8080
  timeout: 30s
  cors_origins: [] # e.g. ["https://app.example.com"]
  trusted_proxies: [] # e.g. ["10.0.0.0/8"]
  max_body_bytes: 1048576

databases:
  postgres:
    # Key must stay "primary": cmd/migrate looks for exactly this name.
    primary:
      host: localhost
      port: 5432
      user: postgres
      password: postgres
      database: attendance
      # verify-full in production. require encrypts but accepts any certificate.
      opts: sslmode=disable connect_timeout=10
      max_open_conns: 25
      max_idle_conns: 5
      conn_max_lifetime: 30m

redis:
  cache:
    host: localhost
    port: 6379
    user:
    password:
    db: 0
    tls: false
    pool_size: 0
    min_idle_conns: 0
    conn_max_lifetime: 30m

storage:
  endpoint: http://localhost:9000 # https://<account_id>.r2.cloudflarestorage.com in production
  region: auto # R2 requires exactly "auto"
  bucket: attendance
  access_key_id: minioadmin
  secret_access_key: minioadmin
  force_path_style: true # required by MinIO, harmless on R2
  presign_ttl: 5m

auth:
  jwt_secret: dev-only-secret-override-AUTH_JWT_SECRET # min 32 chars; refused outside development
  # super_admin created at startup if the email is free; set both in .env
  seed_admin_email:
  seed_admin_password:

attendance:
  timezone: Asia/Jakarta # the zone every schedule's times are read in
  geofence_enforce: false # true refuses a check-in outside every office; false only flags it

logger:
  path: ./logs
  level: INFO # DEBUG, INFO, WARN, or ERROR
  rotation_pattern: daily # daily, or size-based via rotation_size_mb
  rotation_size_mb: 20
  retention_days: 1
  console: true
