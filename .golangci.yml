version: "2"

linters:
  enable:
    # Defaults (errcheck, govet, ineffassign, staticcheck, unused) stay on.
    - bodyclose
    - copyloopvar
    - errorlint
    - lll
    - misspell
    - nolintlint
    - revive
    - sqlclosecheck
    - unconvert
    - usestdlibvars

  settings:
    errcheck:
      check-type-assertions: true
    revive:
      rules:
        - name: exported
        - name: error-strings
        - name: context-as-argument
        - name: indent-error-flow
    lll:
      line-length: 120
      tab-width: 4
    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    # No "comments" preset: it would hide the doc-comment findings kept for pkg/.
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Rewritten by `make oapicodegen`, so fixes here do not survive.
      - path: internal/api/server/oapicodegen/
        linters:
          - revive
          - misspell
          - lll
      # Error-path tests discard a nil response, which bodyclose cannot see is safe.
      - path: _test\.go
        linters:
          - bodyclose
      # Doc comments earn their keep in pkg/, meant to be lifted into other services; not in internal/.
      - path: internal/
        text: "^exported:"
        linters:
          - revive

issues:
  # 0 means no cap: a finding golangci-lint hides is a finding nobody fixes.
  max-issues-per-linter: 0
  max-same-issues: 0
